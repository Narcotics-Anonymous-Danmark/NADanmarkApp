name: Unit and widget tests

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test (defaults to the caller's ref)
        required: false
        type: string
        default: ''
      artifact_name:
        description: Name of the coverage artefact
        required: false
        type: string
        default: coverage-unit-widget
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test (defaults to the branch this is run from)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-toolchain

      - name: Unit tests
        run: ./bin/na test unit --coverage

      - name: Widget tests
        run: ./bin/na test widget --coverage

      - name: Report in the run summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo '### Unit and widget tests'
            echo
            if ls coverage/*.lcov.info > /dev/null 2>&1; then
              echo 'Coverage files:'
              echo
              for f in coverage/*.lcov.info; do
                echo "- \`$(basename "$f")\` ($(grep -c '^SF:' "$f") files)"
              done
            else
              echo '_No coverage files were produced._'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'coverage-unit-widget' }}
          path: coverage/*.lcov.info
          retention-days: 7
          if-no-files-found: error
