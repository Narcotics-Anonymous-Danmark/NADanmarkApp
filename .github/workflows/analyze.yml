name: Analyze

# Format, analyzer, custom lints, ARB parity and dependency layers, all through
# "./bin/na check" so CI runs exactly what the pre-push hook runs.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check (defaults to the caller's ref)
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to check (defaults to the branch this is run from)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-toolchain

      - name: Format, analyze, lint, ARB parity, dependency layers
        run: ./bin/na check
