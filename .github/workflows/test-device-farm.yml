name: E2E tests (Firebase Test Lab)

# Runs the Patrol suite on real/virtual devices in Firebase Test Lab. Nightly
# only: it costs Test Lab minutes and takes far longer than the emulator run.
# Verify model ids with "gcloud firebase test android|ios models list" before
# changing the defaults.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test (defaults to the caller's ref)
        required: false
        type: string
        default: ''
      android_devices:
        description: JSON list of {model, version} for Android
        required: false
        type: string
        default: '[{"model":"MediumPhone.arm","version":"35"},{"model":"shiba","version":"35"}]'
      ios_devices:
        description: JSON list of {model, version} for iOS
        required: false
        type: string
        default: '[{"model":"iphone15pro","version":"18.0"}]'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test (defaults to the branch this is run from)
        required: false
        type: string
        default: ''
      android_devices:
        description: JSON list of {model, version} for Android
        required: false
        type: string
        default: '[{"model":"MediumPhone.arm","version":"35"},{"model":"shiba","version":"35"}]'
      ios_devices:
        description: JSON list of {model, version} for iOS
        required: false
        type: string
        default: '[{"model":"iphone15pro","version":"18.0"}]'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(inputs.android_devices) }}
    name: android (${{ matrix.device.model }} / ${{ matrix.device.version }})

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-toolchain
        with:
          patrol: 'true'

      - uses: ./.github/actions/setup-android

      - name: Build the app and the instrumentation APKs
        working-directory: app
        run: patrol build android --dart-define-from-file=../env/test.json --verbose

      - name: Locate the APKs
        id: apks
        run: |
          set -euo pipefail
          app=$(find app/build/app/outputs/apk -name 'app-debug.apk' | head -1)
          test=$(find app/build/app/outputs/apk -name 'app-debug-androidTest.apk' | head -1)
          if [ -z "$app" ] || [ -z "$test" ]; then
            echo "::error::patrol build android did not produce app-debug.apk and app-debug-androidTest.apk"
            find app/build/app/outputs -name '*.apk' || true
            exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "test=$test" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FTL_SERVICE_ACCOUNT_JSON }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Run on Firebase Test Lab
        env:
          FTL_PROJECT_ID: ${{ vars.FTL_PROJECT_ID }}
          MODEL: ${{ matrix.device.model }}
          VERSION: ${{ matrix.device.version }}
        run: |
          set -euo pipefail
          gcloud firebase test android run \
            --type instrumentation \
            --app "${{ steps.apks.outputs.app }}" \
            --test "${{ steps.apks.outputs.test }}" \
            --device "model=${MODEL},version=${VERSION},locale=da_DK,orientation=portrait" \
            --use-orchestrator \
            --environment-variables clearPackageData=true \
            --timeout 20m \
            --project "$FTL_PROJECT_ID" \
            --format=json 2>&1 | tee "$RUNNER_TEMP/ftl-android.log"

      - name: Report in the run summary
        if: always()
        env:
          MODEL: ${{ matrix.device.model }}
          VERSION: ${{ matrix.device.version }}
        run: |
          {
            echo "### Firebase Test Lab · Android · $MODEL / API $VERSION"
            echo
            grep -Eo 'https://console\.firebase\.google\.com/[^ ]+' "$RUNNER_TEMP/ftl-android.log" 2>/dev/null | head -1 || echo '_No results link captured._'
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(inputs.ios_devices) }}
    name: ios (${{ matrix.device.model }} / ${{ matrix.device.version }})

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Select Xcode
        if: vars.XCODE_VERSION != ''
        run: sudo xcode-select -s "/Applications/Xcode_${{ vars.XCODE_VERSION }}.app"

      - uses: ./.github/actions/setup-toolchain
        with:
          patrol: 'true'

      - name: Restore the CocoaPods cache
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            app/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('app/ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Build the test bundle for physical devices
        working-directory: app
        run: patrol build ios --release --dart-define-from-file=../env/test.json --verbose

      - name: Zip the products and the xctestrun
        id: bundle
        run: |
          set -euo pipefail
          products=app/build/ios_integ/Build/Products
          if [ ! -d "$products" ]; then
            echo "::error::$products does not exist; did patrol build ios --release succeed?"
            exit 1
          fi
          (cd "$products" && zip -qr ios_tests.zip Release-iphoneos ./*.xctestrun)
          echo "zip=$products/ios_tests.zip" >> "$GITHUB_OUTPUT"
          ls -la "$products/ios_tests.zip"

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FTL_SERVICE_ACCOUNT_JSON }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Run on Firebase Test Lab
        env:
          FTL_PROJECT_ID: ${{ vars.FTL_PROJECT_ID }}
          MODEL: ${{ matrix.device.model }}
          VERSION: ${{ matrix.device.version }}
        run: |
          set -euo pipefail
          gcloud firebase test ios run \
            --test "${{ steps.bundle.outputs.zip }}" \
            --device "model=${MODEL},version=${VERSION},locale=da_DK,orientation=portrait" \
            --timeout 20m \
            --project "$FTL_PROJECT_ID" \
            --format=json 2>&1 | tee "$RUNNER_TEMP/ftl-ios.log"

      - name: Report in the run summary
        if: always()
        env:
          MODEL: ${{ matrix.device.model }}
          VERSION: ${{ matrix.device.version }}
        run: |
          {
            echo "### Firebase Test Lab · iOS · $MODEL / iOS $VERSION"
            echo
            grep -Eo 'https://console\.firebase\.google\.com/[^ ]+' "$RUNNER_TEMP/ftl-ios.log" 2>/dev/null | head -1 || echo '_No results link captured._'
          } >> "$GITHUB_STEP_SUMMARY"
