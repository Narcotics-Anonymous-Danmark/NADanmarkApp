name: Build iOS (signed)

# Archives and exports a signed, App Store ready .ipa. Reusable: called by
# "Draft release candidate", and dispatchable on its own to test the pipeline
# without touching a release.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (tag, branch or SHA)
        required: true
        type: string
      expected_version:
        description: Fail if the checkout is not this version
        required: false
        type: string
        default: ''
      expected_build:
        description: Fail if the checkout is not this build number
        required: false
        type: string
        default: ''
      artifact_name:
        required: false
        type: string
        default: ios-release
    outputs:
      artifact_name:
        value: ${{ inputs.artifact_name }}
      ipa:
        value: ${{ jobs.build.outputs.ipa }}
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (defaults to the branch this is run from)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      ipa: ${{ steps.build.outputs.ipa }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Select Xcode
        if: vars.XCODE_VERSION != ''
        run: sudo xcode-select -s "/Applications/Xcode_${{ vars.XCODE_VERSION }}.app"

      - name: Show Xcode and CocoaPods
        run: |
          xcodebuild -version
          pod --version

      - uses: ./.github/actions/setup-toolchain

      - name: Restore the CocoaPods cache
        id: pods-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            app/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('app/ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - uses: ./.github/actions/write-env
        with:
          na_api_basic_auth: ${{ secrets.NA_API_BASIC_AUTH }}
          google_maps_api_key: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Check the version matches what the release expects
        if: inputs.expected_version != ''
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_BUILD: ${{ inputs.expected_build }}
        run: |
          set -euo pipefail
          ./bin/na release version --json > "$RUNNER_TEMP/version.json"
          version=$(jq -r .version "$RUNNER_TEMP/version.json")
          build=$(jq -r .build "$RUNNER_TEMP/version.json")
          if [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "::error::checkout is version $version but the release expects $EXPECTED_VERSION"
            exit 1
          fi
          if [ -n "$EXPECTED_BUILD" ] && [ "$build" != "$EXPECTED_BUILD" ]; then
            echo "::error::checkout is build $build but the release expects $EXPECTED_BUILD"
            exit 1
          fi
          echo "Building $version build $build"

      - name: Pre-flight (secrets, versions, clean worktree)
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: ./bin/na release check ios

      - name: Build the signed archive
        id: build
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ./bin/na release ios --output dist
          ipa=$(ls dist/*.ipa | head -1)
          echo "ipa=$(basename "$ipa")" >> "$GITHUB_OUTPUT"
          echo "### iOS archive" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$(basename "$ipa")\` — $(du -h "$ipa" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name || 'ios-release' }}
          path: dist/*.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Save the CocoaPods cache
        if: always() && steps.pods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            app/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('app/ios/Podfile.lock') }}
