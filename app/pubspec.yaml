name: na_app
description: NA Danmark mobile app for iOS and Android.
publish_to: none
version: 2.0.0+1120000001

environment:
  sdk: ^3.11.0
resolution: workspace

dependencies:
  adapter_bmlt:
    path: ../packages/adapters/adapter_bmlt
  adapter_clock:
    path: ../packages/adapters/adapter_clock
  adapter_jft:
    path: ../packages/adapters/adapter_jft
  adapter_legacy_store:
    path: ../packages/adapters/adapter_legacy_store
  adapter_links:
    path: ../packages/adapters/adapter_links
  adapter_storage:
    path: ../packages/adapters/adapter_storage
  dio: 5.11.1
  feature_contact:
    path: ../packages/features/feature_contact
  feature_jft:
    path: ../packages/features/feature_jft
  feature_legacy_migration:
    path: ../packages/features/feature_legacy_migration
  feature_meetings:
    path: ../packages/features/feature_meetings
  feature_meetings_search:
    path: ../packages/features/feature_meetings_search
  feature_settings:
    path: ../packages/features/feature_settings
  feature_shell:
    path: ../packages/features/feature_shell
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.3.2
  go_router: 16.3.0
  na_design:
    path: ../packages/core/na_design
  na_kernel:
    path: ../packages/core/na_kernel
  na_l10n:
    path: ../packages/core/na_l10n
  na_ports:
    path: ../packages/core/na_ports
  package_info_plus: 8.3.1
  shared_preferences: 2.5.5

dev_dependencies:
  custom_lint: 0.8.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  na_lints:
    path: ../tool/na_lints
  na_testing:
    path: ../packages/core/na_testing
  patrol: 3.20.0
  patrol_finders: 2.9.0
  shared_preferences_platform_interface: 2.4.2
  very_good_analysis: 10.2.0

flutter:
  uses-material-design: false

patrol:
  app_name: NA Danmark
  android:
    package_name: dk.nadanmark.app
  ios:
    bundle_id: dk.nadanmark.ios.app
    app_name: NA Danmark
