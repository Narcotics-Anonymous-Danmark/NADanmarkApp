publish_to: none
version: 0.0.0

environment:
  sdk: ^3.11.0
resolution: workspace

dependencies:
  audio_service: 0.18.19
  audio_session: 0.2.4
  flutter:
    sdk: flutter
  just_audio: 0.10.6
  na_kernel:
    path: ../../core/na_kernel
  na_ports:
    path: ../../core/na_ports
  path_provider: 2.1.6
  riverpod: 3.3.2

dev_dependencies:
  audio_service_platform_interface: 0.1.3
  custom_lint: 0.8.1
  flutter_test:
    sdk: flutter
  just_audio_platform_interface: 4.6.0
  na_lints:
    path: ../../../tool/na_lints
  na_testing:
    path: ../../core/na_testing
  path_provider_platform_interface: 2.1.2
