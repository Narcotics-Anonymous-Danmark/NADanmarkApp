schema: spec-driven

context: |
  Language: English
  All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Project overview and glossary: openspec/project.md.
  Coding rules: docs/CODING_GUIDELINES.md. Test levels and naming: docs/TESTING.md.
  Layering and Riverpod wiring: docs/ARCHITECTURE.md.
  The legacy Ionic app in ../App is the behavioural reference; specs list
  deliberate differences under "Intentional deltas from the legacy app".
  Every "#### Scenario:" becomes an acceptance test with the same name.
  UI strings in specs are English; every user-facing string lives in both ARB files.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
